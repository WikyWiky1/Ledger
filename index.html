function hexToRgb(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16)||0;return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function rgbToHex(r,g,b){const f=v=>('0'+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2);
  return '#'+f(r)+f(g)+f(b);}
function hslToHex(h,s,l){ s/=100;l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  return rgbToHex(255*f(0),255*f(8),255*f(4)); }
function hexToHsl(hex){ const {r,g,b}=hexToRgb(hex), R=r/255,G=g/255,B=b/255;
  const mx=Math.max(R,G,B),mn=Math.min(R,G,B); let h,s,l=(mx+mn)/2;
  if(mx===mn){h=s=0;}else{const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case R:h=(G-B)/d+(G<B?6:0);break;case G:h=(B-R)/d+2;break;default:h=(R-G)/d+4;} h/=6;}
  return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)}; }
function darken(hex,amt){const {h,s,l}=hexToHsl(hex);return hslToHex(h,s,Math.max(8,l-amt));}
function hexToRgba(hex,a){const {r,g,b}=hexToRgb(hex);return `rgba(${r},${g},${b},${a})`;}
function customThemeVars(hex){
  const {h,s,l}=hexToHsl(hex);
  const S=Math.max(30,Math.min(s,72));                 // keep the hue clearly visible
  const bgL=Math.max(9,Math.min(Math.round(l*0.30),22)); // dark, but tracks the chosen lightness
  return {
    '--bg':hslToHex(h,S,bgL),
    '--surface':hslToHex(h,S,bgL+6),
    '--surface-2':hslToHex(h,S,bgL+11),
    '--line':hslToHex(h,Math.max(18,S-10),bgL+20),
    '--line-soft':hslToHex(h,Math.max(16,S-12),bgL+12),
    '--text':'#EAECEF','--muted':'#9AA1AB','--dim':'#6E7580',
    '--accent':hex,'--accent-dim':darken(hex,22),
    '--hit':'#9CBF6E','--deload':'#C9A227','--radius':'10px',
    '--header-bg':hexToRgba(hslToHex(h,S,Math.max(6,bgL-2)),.9),
    '--scrim':hexToRgba(hslToHex(h,S,Math.max(4,bgL-4)),.8)
  };
}
function buildStars(){
  const wrap=document.getElementById('stars');
  if(!wrap||wrap.dataset.built) return;
  [['far',42],['near',26]].forEach(([cls,count])=>{
    const layer=document.createElement('div');
    layer.className='star-layer '+cls;
    let html='';
    for(let i=0;i<count;i++){
      const x=(Math.random()*100).toFixed(2), y=(Math.random()*50).toFixed(2);
      const sz=((cls==='near'?1.5:0.9)+Math.random()*1.1).toFixed(2);
      const d=(Math.random()*6).toFixed(2), dur=(3+Math.random()*4).toFixed(2), op=(0.5+Math.random()*0.5).toFixed(2);
      const st=`left:${x}%;width:${sz}px;height:${sz}px;--o:${op};animation-delay:${d}s;animation-duration:${dur}s`;
      html+=`<span class="star" style="${st};top:${y}%"></span>`;
      html+=`<span class="star" style="${st};top:${(+y+50).toFixed(2)}%"></span>`;
    }
    layer.innerHTML=html;
    wrap.appendChild(layer);
  });
  wrap.dataset.built='1';
}

function applyAppearance(){
  const ap=state.appearance||{};
  const themeKey=ap.theme||'default';
  const base=THEMES[themeKey]||THEMES.default;
  const vars=(themeKey==='custom')?customThemeVars(ap.themeColor||'#7C83E8'):base.vars;
  const root=document.documentElement;
  Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
  Object.values(THEMES).forEach(t=>{ if(t.body) document.body.classList.remove(t.body); });
  if(base.body) document.body.classList.add(base.body);
  if(ap.accent){ root.style.setProperty('--accent',ap.accent);
    root.style.setProperty('--accent-dim',darken(ap.accent,22)); }
  if(ap.hit) root.style.setProperty('--hit',ap.hit);
  const wm=document.getElementById('wordmark'); if(wm) wm.textContent=ap.name||'Ledger';
  const accent=ap.accent||vars['--accent'], bg=vars['--bg'];
  buildStars();
  buildIcon(accent,bg);
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.setAttribute('content',bg);
}
function buildIcon(accent,bg){
  try{
    const S=180,c=document.createElement('canvas');c.width=S;c.height=S;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,S); g.addColorStop(0,'#1E2529'); g.addColorStop(1,bg||'#0E1113');
    x.fillStyle=g; x.fillRect(0,0,S,S);
    const T=(px,py,w,h,col,r=5.5)=>{x.fillStyle=col;
      const X=24+px*5.5,Y=24+py*5.5,W=w*5.5,H=h*5.5;
      if(x.roundRect){x.beginPath();x.roundRect(X,Y,W,H,r);x.fill();}else x.fillRect(X,Y,W,H);};
    T(1,9,3.2,6,accent); T(19.8,9,3.2,6,accent);
    T(5.2,6.5,3,11,'#8B9599'); T(15.8,6.5,3,11,'#8B9599');
    T(8.4,11,7.2,2,'#EDEFEF',2);
    const url=c.toDataURL('image/png');
    let link=document.querySelector('link[rel="apple-touch-icon"]');
    if(!link){link=document.createElement('link');link.rel='apple-touch-icon';document.head.appendChild(link);}
    link.href=url;
  }catch(e){/* the icon is cosmetic — never break the app over it */}
}

function openAppearance(){
  const ap=state.appearance||{};
  const themeKey=ap.theme||'default';
  const themeVars=(themeKey==='custom')?customThemeVars(ap.themeColor||'#7C83E8'):(THEMES[themeKey]||THEMES.default).vars;
  const curAccent=ap.accent||themeVars['--accent'];
  const a=hexToHsl(curAccent);
  const accentCustom=!!ap.accentCustom;
  const swatches=COLOR_PRESETS.map(p=>`
    <button class="swatch ${(ap.accent||'').toLowerCase()===p.accent.toLowerCase()?'on':''}"
      data-preset="${esc(p.accent)}" data-hit="${esc(p.hit||'')}" title="${esc(p.name)}"
      style="background:${p.accent}"></button>`).join('');
  const accentHud=accentCustom?`
    <div class="hud">
      <div class="hud-prev" id="hudPrev" style="background:${curAccent};box-shadow:0 0 20px -2px ${curAccent}"></div>
      <div class="hud-sliders">
        <label class="hud-row"><span>HUE</span><input type="range" min="0" max="360" value="${a.h}" id="slH"></label>
        <label class="hud-row"><span>SAT</span><input type="range" min="0" max="100" value="${a.s}" id="slS"></label>
        <label class="hud-row"><span>LUM</span><input type="range" min="20" max="80" value="${a.l}" id="slL"></label>
      </div>
    </div>`:'';
  const themeRows=Object.keys(THEMES).map(k=>`
    <button class="menu-item ${(themeKey===k)?'chosen':''}" data-theme="${k}">
      ${esc(THEMES[k].name)}${themeKey===k?' ✓':''}</button>`).join('');
  const tcol=ap.themeColor||'#7C83E8', tc=hexToHsl(tcol);
  const themeHud=(themeKey==='custom')?`
    <div class="hud">
      <div class="hud-prev" id="thPrev" style="background:${tcol};box-shadow:0 0 20px -2px ${tcol}"></div>
      <div class="hud-sliders">
        <label class="hud-row"><span>HUE</span><input type="range" min="0" max="360" value="${tc.h}" id="tlH"></label>
        <label class="hud-row"><span>SAT</span><input type="range" min="20" max="100" value="${tc.s}" id="tlS"></label>
        <label class="hud-row"><span>LUM</span><input type="range" min="30" max="75" value="${tc.l}" id="tlL"></label>
      </div>
    </div>`:'';
  openSheet('Appearance',`
    <button class="backrow" data-back="1">‹ Options</button>
    <div class="chartlbl">Accent color</div>
    <div class="swatches">${swatches}</div>
    <button class="menu-item ${accentCustom?'chosen':''}" data-accentcustom="1">Custom accent color${accentCustom?' ✓':''}</button>
    ${accentHud}
    ${(ap.accent||accentCustom)?`<button class="menu-item" data-clearaccent="1">Reset accent to theme default</button>`:''}
    <div class="chartlbl" style="margin-top:16px">Theme</div>
    ${themeRows}
    ${themeHud}
    <div class="chartlbl" style="margin-top:16px">Name</div>
    <button class="menu-item" data-rename-app="1">Rename the app — currently "${esc(ap.name||'Ledger')}"</button>
    <div class="note">Presets apply instantly; mark Custom to expand the sliders. Selecting the Custom theme lets you tint the whole app from one color. The Home Screen icon takes the new color the next time you remove and re-add the app.</div>`);
  const slH=document.getElementById('slH'),slS=document.getElementById('slS'),slL=document.getElementById('slL');
  const liveAccent=hex=>{
    document.documentElement.style.setProperty('--accent',hex);
    document.documentElement.style.setProperty('--accent-dim',darken(hex,22));
    const pv=document.getElementById('hudPrev'); if(pv){ pv.style.background=hex; pv.style.boxShadow='0 0 20px -2px '+hex; }
  };
  const onAccent=()=>{ const hex=hslToHex(+slH.value,+slS.value,+slL.value);
    if(!state.appearance) state.appearance={}; state.appearance.accent=hex; liveAccent(hex); };
  [slH,slS,slL].forEach(sl=>{ if(sl){ sl.oninput=onAccent; sl.onchange=()=>{ onAccent(); applyAppearance(); saveNow(); }; }});
  const tlH=document.getElementById('tlH'),tlS=document.getElementById('tlS'),tlL=document.getElementById('tlL');
  const liveTheme=hex=>{
    const v=customThemeVars(hex), root=document.documentElement;
    Object.entries(v).forEach(([k,val])=>root.style.setProperty(k,val));
    if(state.appearance&&state.appearance.accent){ root.style.setProperty('--accent',state.appearance.accent);
      root.style.setProperty('--accent-dim',darken(state.appearance.accent,22)); }
    const pv=document.getElementById('thPrev'); if(pv){ pv.style.background=hex; pv.style.boxShadow='0 0 20px -2px '+hex; }
  };
  const onTheme=()=>{ const hex=hslToHex(+tlH.value,+tlS.value,+tlL.value);
    if(!state.appearance) state.appearance={}; state.appearance.themeColor=hex; liveTheme(hex); };
  [tlH,tlS,tlL].forEach(sl=>{ if(sl){ sl.oninput=onTheme; sl.onchange=()=>{ onTheme(); applyAppearance(); saveNow(); }; }});
  $('#sheetBody').onclick=ev=>{
    if(!state.appearance) state.appearance={};
    const bk=ev.target.closest('[data-back]'); if(bk){ openOptions(); return; }
    const sw=ev.target.closest('[data-preset]');
    if(sw){ state.appearance.accent=sw.dataset.preset; state.appearance.hit=sw.dataset.hit||'';
      state.appearance.accentCustom=false; applyAppearance(); saveNow(); openAppearance(); return; }
    const acu=ev.target.closest('[data-accentcustom]');
    if(acu){ state.appearance.accentCustom=!state.appearance.accentCustom;
      if(state.appearance.accentCustom&&!state.appearance.accent) state.appearance.accent=curAccent;
      applyAppearance(); saveNow(); openAppearance(); return; }
    const ca=ev.target.closest('[data-clearaccent]');
    if(ca){ state.appearance.accent=''; state.appearance.hit=''; state.appearance.accentCustom=false;
      applyAppearance(); saveNow(); openAppearance(); return; }
    const th=ev.target.closest('[data-theme]');
    if(th){ state.appearance.theme=th.dataset.theme;
      if(th.dataset.theme==='custom'&&!state.appearance.themeColor) state.appearance.themeColor='#7C83E8';
      if(th.dataset.theme==='nintendo'){ state.appearance.accent=''; state.appearance.hit=''; state.appearance.accentCustom=false; }
      applyAppearance(); saveNow(); openAppearance(); return; }
    const rn=ev.target.closest('[data-rename-app]');
    if(rn){ askText('App name',state.appearance.name||'Ledger','Shows in the header. Keep it short.').then(v=>{
      if(v===null) return; state.appearance.name=String(v).slice(0,16); applyAppearance(); saveNow(); openAppearance(); }); return; }
  };
}

/* ================= options (one-level drill-downs) ================= */
function openOptions(){
  const p=phaseOf();
  openSheet('Options',`
    <div class="note">Week ${p+1} of the 3-week block${p===2?' — deload':''}. Load weeks push the target; the deload week shows 85% at the top of the range and holds your progression.</div>
    <button class="menu-item drill" data-cat="appearance">Appearance <span class="chev">›</span></button>
    <button class="menu-item drill" data-cat="workout">Workout &amp; program <span class="chev">›</span></button>
    <button class="menu-item drill" data-cat="data">Data &amp; backup <span class="chev">›</span></button>`);
  $('#sheetBody').onclick=ev=>{
    const b=ev.target.closest('[data-cat]'); if(!b) return;
    const cat=b.dataset.cat;
    if(cat==='appearance') openAppearance();
    else if(cat==='workout') openWorkoutMenu();
    else if(cat==='data') openDataMenu();
  };
}
function openWorkoutMenu(){
  const paused=!!state.deloadPaused;
  openSheet('Workout & program',`
    <button class="backrow" data-back="1">‹ Options</button>
    <button class="menu-item" data-act="library">Exercise library</button>
    <button class="menu-item" data-act="deload">Deload cycle: <b style="color:${paused?'var(--deload)':'var(--hit)'}">${paused?'Paused':'On'}</b> — tap to ${paused?'resume':'pause'}</button>
    <button class="menu-item" data-act="rename">Rename this day</button>
    <button class="menu-item" data-act="addday">Add a day to the rotation</button>
    <button class="menu-item" data-act="delday">Remove this day</button>
    <button class="menu-item" data-act="anchor">Restart the 3-week block this week</button>`);
  $('#sheetBody').onclick=ev=>{
    const bk=ev.target.closest('[data-back]'); if(bk){ openOptions(); return; }
    const b=ev.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='deload'){
      state.deloadPaused=!state.deloadPaused;
      render(); saveNow(); openWorkoutMenu();
      toast(state.deloadPaused?'Deload paused — every week counts as a load week':'Deload cycle back on');
      return;
    }
    workoutAction(b.dataset.act);
  };
}
function openDataMenu(){
  openSheet('Data & backup',`
    <button class="backrow" data-back="1">‹ Options</button>
    <button class="menu-item" data-act="backup">Backup &amp; restore</button>
    <button class="menu-item" data-act="storage">Storage status</button>
    <button class="menu-item danger" data-act="reset">Reset everything</button>`);
  $('#sheetBody').onclick=ev=>{
    const bk=ev.target.closest('[data-back]'); if(bk){ openOptions(); return; }
    const b=ev.target.closest('[data-act]'); if(!b) return;
    const a=b.dataset.act;
    if(a==='backup'){ openBackup(); return; }
    if(a==='storage'){ openStorage(); return; }
    if(a==='reset'){
      askYes('Reset everything',
        'Delete every day, exercise, saved goal, and logged session, and start from the original program. This cannot be undone — export a backup first if you want one.',
        'Reset all').then(yes=>{
          if(!yes) return;
          const ap=state.appearance; state=defaults(); state.appearance=ap||{};
          closeSheet(); render(); applyAppearance(); saveNow(); toast('Reset to the starting program');
        });
      return;
    }
  };
}
function workoutAction(a){
  if(a==='library'){ openPicker(); return; }
  if(a==='rename'){
    const d=day();
    askText('Day name',d.name,'What this day is called in the rotation.').then(n=>{
      if(!n) return;
      d.name=n; render(); saveNow();
      return askText('Subtitle',d.sub||'','Optional — the small line under the title.').then(s=>{
        if(s===null) return;
        d.sub=s; closeSheet(); render(); saveNow(); toast('Day updated');
      });
    });
    return;
  }
  if(a==='addday'){
    askText('New day','','It slots in right after the day you are on.').then(n=>{
      if(!n) return;
      state.days.splice(state.cycle+1,0,{id:uid(),name:n,sub:'',ex:[]});
      state.cycle++; closeSheet(); render(); saveNow(); toast(`${n} added to the rotation`);
    });
    return;
  }
  if(a==='delday'){
    if(state.days.length<2){ toast('Need at least one day'); return; }
    const d=day();
    askYes('Remove day',
      `Take ${d.name} out of the rotation? Its ${d.ex.length} exercise${d.ex.length===1?'':'s'} stay saved in your library.`,
      'Remove').then(yes=>{
        if(!yes) return;
        d.ex.forEach(libSave);
        state.days.splice(state.cycle,1);
        state.cycle=state.cycle%state.days.length;
        closeSheet(); render(); saveNow(); toast(`${d.name} removed`);
      });
    return;
  }
  if(a==='anchor'){
    state.anchor=weekStart(new Date()).toISOString();
    closeSheet(); render(); saveNow(); toast('Block restarted — this is week 1');
    return;
  }
}
$('#btnMenu').onclick=openOptions;

/* ================= boot ================= */
(async()=>{
  await detectBackends();
  const saved=await load();
  if(saved&&saved.days&&saved.days.length){
    state=saved;
    if(!state.anchor) state.anchor=weekStart(new Date()).toISOString();
    if(!state.library) state.library={};
    if(!Array.isArray(state.cardio)) state.cardio=[];
    if(!state.appearance) state.appearance={};
  }
  syncLibrary();
  promotePending();
  applyAppearance();
  render();
  saveNow();

  // tabbing or tapping out of a field commits it (coalesced, so rapid entry is one write)
  document.addEventListener('focusout',e=>{
    if(e.target&&e.target.tagName==='INPUT') save();
  });
  // leaving the app, switching tabs, or closing flushes whatever is pending
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){ saveNow(); return; }
    if(promotePending()){ render(); saveNow(); toast('New week — targets moved up'); }
  });
  window.addEventListener('pagehide',()=>{ saveNow(); });
  window.addEventListener('blur',()=>{ saveNow(); });
})();
</script>
